version: "3.9"
services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./server
    container_name: tutoring-backend
    restart: always
    volumes:
      - uploads_data:/app/uploads/notes  # ✅ mount uploads directory
      - monzo_secrets:/app/secrets  # ✅ mount secrets directory
    environment:
      FLASK_APP: app.py
      FLASK_ENV: production
      POSTGRES_HOST: db
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build: ./client
    container_name: tutoring-frontend
    restart: always
    depends_on:
      - backend

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  uploads_data:  # ✅ this is the named volume for notes
  monzo_secrets: